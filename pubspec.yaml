name: pose_coach
description: PoseCoach – Real-time AI Pose Guidance & Photo Enhancement App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & Sensors
  camera: ^0.11.0+2
  sensors_plus: ^6.0.1

  # ML / Pose Detection
  google_mlkit_pose_detection: ^0.11.0
  tflite_flutter: ^0.12.1

  # Permissions & File/Gallery
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  http: ^1.2.2
  gal: ^2.3.0
  path_provider: ^2.1.4

  # Image Processing
  image: ^4.2.0

  # Local Storage
  shared_preferences: ^2.3.2      # non-sensitive flags only (onboarding)
  flutter_secure_storage: ^9.2.2  # AES-256 + Android Keystore for sensitive data

  # Utilities
  uuid: ^4.4.2
  cupertino_icons: ^1.0.8
  exif: ^3.3.0

  # Manual overlay editor — lets users draw/erase corrections on the AI-generated
  # pose mask before saving a reference. Chosen for its built-in brush/erase,
  # undo-redo stack, and direct PNG mask export.
  flutter_mask_painter: ^1.0.1

  # SVG rendering for custom CameraCoach icons
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # ── Locally-bundled Inter font (4 weights) ─────────────────────────────────
  # Files are in assets/fonts/. No network dependency — resolves offline.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/models/
    - assets/images/
    - assets/fonts/
    - assets/icons/

